<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    Icône cyber-funk : un soleil synthwave, cinq barres d'égaliseur néon devant lui.
    Conçue pour rester lisible à 16 px : deux grandes formes, deux couleurs, aucun filtre de flou
    (le flou devient de la bouillie en petit). La lueur est un simple trait plus large et translucide.
    Régénérer les PNG/ICO : python3 -I tools/icons/generate.py
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07030f" />
      <stop offset="100%" stop-color="#1b0836" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb000" />
      <stop offset="55%" stop-color="#ff2d78" />
      <stop offset="100%" stop-color="#b3129e" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ffff" />
      <stop offset="35%" stop-color="#19f0ff" />
      <stop offset="100%" stop-color="#0a8cff" />
    </linearGradient>
    <!-- Le soleil est découpé par des fentes qui s'élargissent vers le bas. -->
    <mask id="slits">
      <rect width="512" height="512" fill="#fff" />
      <rect x="0" y="292" width="512" height="10" fill="#000" />
      <rect x="0" y="322" width="512" height="16" fill="#000" />
      <rect x="0" y="356" width="512" height="22" fill="#000" />
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="104" /></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)" />

    <!-- Soleil : un grand disque, rien d'autre derrière. -->
    <circle cx="256" cy="268" r="196" fill="url(#sun)" mask="url(#slits)" />

    <!-- Sol : un aplat sombre qui coupe le soleil, et un filet néon d'horizon. -->
    <rect x="0" y="384" width="512" height="128" fill="#07030f" />
    <rect x="0" y="380" width="512" height="8" fill="#19f0ff" />

    <!-- Égaliseur : cinq barres, la centrale dépasse du soleil (le kick). -->
    <g>
      <!-- Lueurs : même forme, plus large, translucide. -->
      <g fill="#19f0ff" opacity="0.28">
        <rect x="58" y="230" width="68" height="190" rx="22" />
        <rect x="140" y="170" width="68" height="250" rx="22" />
        <rect x="222" y="82" width="68" height="338" rx="22" />
        <rect x="304" y="150" width="68" height="270" rx="22" />
        <rect x="386" y="214" width="68" height="206" rx="22" />
      </g>
      <g fill="url(#bar)" stroke="#07030f" stroke-width="10" paint-order="stroke">
        <rect x="66" y="238" width="52" height="174" rx="16" />
        <rect x="148" y="178" width="52" height="234" rx="16" />
        <rect x="230" y="90" width="52" height="322" rx="16" />
        <rect x="312" y="158" width="52" height="254" rx="16" />
        <rect x="394" y="222" width="52" height="190" rx="16" />
      </g>
    </g>
  </g>
</svg>
