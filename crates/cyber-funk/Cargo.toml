[package]
name = "cyber-funk"
description = "Visuels 3D temps réel pour soirées DJ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Développement uniquement : liaison dynamique de Bevy (compilation plus rapide) et rechargement à chaud des assets.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
# Sonde de test : canal de contrôle local (TCP, 127.0.0.1) pour le serveur MCP. Rien n'écoute sans `--probe`.
probe = ["dep:cf-probe-proto", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
cargo-packager-updater.workspace = true
bevy.workspace = true
cf-audio.workspace = true
cf-cinema.workspace = true
cf-debuglog.workspace = true
cf-operator.workspace = true
cf-probe-proto = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
cf-render.workspace = true
cf-show.workspace = true
cf-world-neon.workspace = true
clap.workspace = true
dirs.workspace = true
sysinfo.workspace = true
cf-control.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
