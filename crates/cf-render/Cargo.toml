[package]
name = "cf-render"
description = "Plugin Bevy : ordre de l'image, couches, post-process, streaming, culling, qualité, palettes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `2d_bevy_render` : `Camera2d` et `Text2d` de la surcouche 2D (les cartons-titres).
bevy = { workspace = true, features = ["2d_bevy_render"] }
cf-analysis.workspace = true
cf-audio.workspace = true
cf-control.workspace = true
cf-show.workspace = true
rand_pcg.workspace = true
ron.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Exemples fenêtrés (`box_city`, `layers_demo`, `culling_city`, `postfx_demo`), pour juger à l'œil : hors CI, ils lient
# un binaire Bevy complet.
demo = []

[[example]]
name = "box_city"
required-features = ["demo"]

[[example]]
name = "layers_demo"
required-features = ["demo"]

[[example]]
name = "culling_city"
required-features = ["demo"]

[[example]]
name = "postfx_demo"
required-features = ["demo"]
