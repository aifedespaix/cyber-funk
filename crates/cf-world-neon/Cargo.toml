[package]
name = "cf-world-neon"
description = "Plugin Bevy : le monde Neon City repris de Sillage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bevy.workspace = true
cf-analysis.workspace = true
cf-cinema.workspace = true
cf-render.workspace = true
cf-show.workspace = true
meshopt.workspace = true
rand_core.workspace = true
rand_pcg.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true

[features]
# Exemples fenêtrés (`road_demo`), pour juger à l'œil : hors CI, ils lient un binaire Bevy complet.
demo = []

[[example]]
name = "road_demo"
path = "examples/road_demo/main.rs"
required-features = ["demo"]

[[example]]
name = "car_demo"
path = "examples/car_demo/main.rs"
required-features = ["demo"]

[[example]]
name = "city_demo"
path = "examples/city_demo/main.rs"
required-features = ["demo"]

[[example]]
name = "pilot_demo"
path = "examples/pilot_demo/main.rs"
required-features = ["demo"]

[[example]]
name = "sky_demo"
path = "examples/sky_demo/main.rs"
required-features = ["demo"]
