[package]
name = "cf-control"
description = "Actions, clavier abstrait, MIDI, MIDI Clock, Ableton Link, OSC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `rc` : les identifiants de titres et de déclencheurs sont des `Arc<str>`, pour que cloner une `Action` n'alloue pas.
serde = { workspace = true, features = ["rc"] }
ron.workspace = true
thiserror.workspace = true
midir.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
# Le callback MIDI est un chemin temps réel : il s'exécute sous `assert_no_alloc` (voir `midi::callback`).
assert_no_alloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
