name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Sur main on n'annule jamais : un build Windows coupé ne sauvegarde pas son cache, et le suivant repart de zéro.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Pas d'infos de débogage en CI : les PDB de MSVC sont très lourds à écrire sous Windows.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Tant que le workspace Cargo n'existe pas (avant la tâche J0-01), la CI se contente de le signaler.
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; echo "::notice::Pas encore de Cargo.toml : checks Rust ignorés."; fi

  fmt:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dépendances système (audio, udev, fenêtrage)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Garde d'architecture (logique métier sans Bevy)
        run: |
          for c in cf-audio cf-analysis cf-control cf-show; do
            if cargo tree -p "$c" -e normal --prefix none --locked | grep -q '^bevy'; then
              echo "::error::$c dépend de Bevy (interdit, voir CLAUDE.md règle 5)"; exit 1
            fi
          done

  test:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (audio, udev, fenêtrage)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked

  deny:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: [detect, clippy]
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked
