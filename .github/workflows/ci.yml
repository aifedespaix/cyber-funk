name: CI

# Sur une PR : ce workflow tourne seul. Sur `main` : il est appelé par `release.yml` (job `ci`), qui ne publie rien tant
# qu'il n'est pas vert. Il ne se déclenche donc plus lui-même sur un push : les tests ne tournent qu'une fois, et une
# release ne peut plus sortir avec un test rouge.
on:
  pull_request:
  workflow_call:

concurrency:
  # `github.workflow` vaut le nom de l'appelant (« Release ») quand ce workflow est appelé : pas de groupe partagé.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Sur main on n'annule jamais : un build Windows coupé ne sauvegarde pas son cache, et le suivant repart de zéro.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Pas d'infos de débogage en CI : les PDB de MSVC sont très lourds à écrire sous Windows.
  CARGO_PROFILE_DEV_DEBUG: 0

# Caches (Swatinem/rust-cache) : seule `main` les écrit, les PR les relisent. Un cache écrit par une PR n'est visible
# que d'elle et ronge le quota de 10 Go, jusqu'à évincer ceux de `main`.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dépendances système (audio, udev, fenêtrage)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Garde d'architecture (logique métier sans Bevy)
        run: |
          for c in cf-audio cf-analysis cf-control cf-show; do
            if cargo tree -p "$c" -e normal --prefix none --locked | grep -q '^bevy'; then
              echo "::error::$c dépend de Bevy (interdit, voir CLAUDE.md règle 5)"; exit 1
            fi
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (audio, udev, fenêtrage)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Sans cela un test rouge empêche d'écrire le cache : chaque run suivant recompile Bevy (20 min) tant que
          # le test n'est pas réparé.
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `--no-fail-fast` : tous les tests rouges d'un coup, pas un par run.
      - run: cargo nextest run --workspace --all-features --locked --no-tests=pass --no-fail-fast
      - run: cargo test --workspace --doc --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked
