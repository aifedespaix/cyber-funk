name: Release

# Chaque push sur `main` produit les paquets d'installation et les publie dans une release GitHub PUBLIQUE.
# Version = MAJEUR.MINEUR de Cargo.toml + numéro de run comme patch (ex. v0.1.57) : elle croît à chaque push, ce que
# l'outil de mise à jour automatique exige. Le patch est injecté au build, il n'est pas écrit dans le dépôt.
# Changer MAJEUR.MINEUR = modifier `version` dans Cargo.toml et packager.json (ex. 0.2.0).
#
# Mise à jour automatique (J9-06) : les paquets applicables par l'application (.exe, .AppImage, .app.tar.gz) sont signés
# avec la clé privée du secret `UPDATER_PRIVATE_KEY` ; `latest.json` les décrit. Voir docs/distribution.md.

on:
  push:
    branches: [main]
    # Une doc ou une fiche de tâche ne justifie pas une release.
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Un seul build de release à la fois, sans jamais en annuler un en cours (le suivant attend).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Version de cargo-packager épinglée : le format de configuration change d'une version à l'autre.
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Calculer la version
        id: v
        run: |
          base="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          json_version="$(grep -m1 '"version"' packager.json | cut -d'"' -f4)"
          if [ "$json_version" != "$base" ]; then
            echo "::error::packager.json ($json_version) et Cargo.toml ($base) ne sont pas alignés"; exit 1
          fi
          echo "version=${base%.*}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Aucune piste personnelle dans le paquet
        run: |
          if [ -d assets/music/local ] && [ -n "$(ls -A assets/music/local)" ]; then
            echo "::error::assets/music/local n'est pas vide : ces pistes ne doivent jamais être distribuées"; exit 1
          fi
      - name: Clé de signature des mises à jour présente
        env:
          KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret UPDATER_PRIVATE_KEY absent (Settings, Secrets and variables, Actions). Voir docs/distribution.md"; exit 1
          fi

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc ancienne : l'AppImage tourne sur plus de distributions
            formats: appimage
          - os: windows-latest
            formats: nsis
          - os: macos-latest # Apple Silicon (arm64) ; `app` sert à la mise à jour automatique, `dmg` à l'installation
            formats: dmg,app
    runs-on: ${{ matrix.os }}
    # bash partout : sous Windows le shell par défaut est PowerShell, où "$VAR" ne se développe pas.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Injecter la version de release
        run: |
          base="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          sed -i.bak "s/^version = \"$base\"/version = \"$VERSION\"/" Cargo.toml
          sed -i.bak "s/\"version\": \"$base\"/\"version\": \"$VERSION\"/" packager.json
          cargo update --workspace
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config libfuse2
      - name: Installer cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - name: Compiler le binaire
        run: cargo build --release --locked -p cyber-funk
      - name: Créer les paquets
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Archive du .app pour la mise à jour (macOS)
        if: runner.os == 'macOS'
        run: tar -C dist -czf "dist/cyber-funk_${VERSION}_aarch64.app.tar.gz" cyber-funk.app
      - name: Archive tar.gz portable (Linux)
        if: runner.os == 'Linux'
        run: |
          name="cyber-funk-v${VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/cyber-funk "dist/$name/"
          cp -r assets "dist/$name/assets"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: Signer les paquets de mise à jour
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in dist/*.AppImage dist/*-setup.exe dist/*.app.tar.gz; do
            [ -f "$f" ] && cargo packager signer sign "$f"
          done
          ls dist/*.sig
      - uses: actions/upload-artifact@v7
        with:
          name: paquet-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.sig
          if-no-files-found: error

  release:
    needs: [checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - name: Manifeste de mise à jour (latest.json)
        working-directory: paquets
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          entry() { # $1 = fichier, $2 = format de mise à jour
            jq -n --arg url "$base/$1" --arg sig "$(cat "$1.sig")" --arg fmt "$2" \
              '{url: $url, signature: $sig, format: $fmt}'
          }
          win="$(entry "$(ls ./*-setup.exe | xargs -n1 basename)" nsis)"
          lin="$(entry "$(ls ./*.AppImage | xargs -n1 basename)" appimage)"
          mac="$(entry "$(ls ./*.app.tar.gz | xargs -n1 basename)" app)"
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$win" --argjson lin "$lin" --argjson mac "$mac" \
            '{version: $v, pub_date: $d, platforms: {
              "windows-x86_64": $win, "linux-x86_64": $lin, "macos-aarch64": $mac, "darwin-aarch64": $mac}}' > latest.json
          cat latest.json
      - name: Somme de contrôle
        run: cd paquets && sha256sum * > SHA256SUMS.txt
      - name: Release GitHub publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" paquets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "v$VERSION" \
            --generate-notes
